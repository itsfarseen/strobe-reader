<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default" lets the status bar follow the page instead of forcing a
         light bar over dark themes; theme-color is kept in sync in themes.js. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Strobe Reader</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <!-- ========================= LIBRARY ========================= -->
    <section id="library" class="view active">
      <header class="lib-header">
        <h1>Strobe Reader</h1>
        <button id="import-btn" class="primary">＋ Add book</button>
        <input
          id="import-input"
          type="file"
          accept=".epub,application/epub+zip"
          multiple
          hidden
        />
      </header>
      <p id="empty-state" class="empty">
        Your library is empty. Tap <strong>Add book</strong> to import an EPUB.
      </p>
      <div id="book-grid" class="book-grid"></div>
    </section>

    <!-- ========================= READER ========================= -->
    <section id="reader" class="view">
      <div id="reader-viewport">
        <!-- Flickered background layer; sits behind the text, click-through. -->
        <div id="strobe-overlay"></div>
        <div id="reader-content"></div>
      </div>

      <!-- Top overlay -->
      <div id="reader-top" class="overlay overlay-top">
        <button id="back-btn" class="icon-btn" title="Back to library">‹</button>
        <span id="book-title" class="reader-title"></span>
        <button id="toc-btn" class="icon-btn" title="Contents">☰</button>
      </div>

      <!-- Bottom overlay -->
      <div id="reader-bottom" class="overlay overlay-bottom">
        <div class="progress-row">
          <div class="progress-track"><div id="progress-bar"></div></div>
          <span id="progress-label" class="progress-label"></span>
        </div>
        <div class="controls-row">
          <div class="font-controls">
            <button id="font-dec" class="ctl-btn">A−</button>
            <span id="font-value" class="font-value"></span>
            <button id="font-inc" class="ctl-btn">A＋</button>
          </div>
          <button id="edit-theme-btn" class="ctl-btn">Themes</button>
          <button id="edit-typo-btn" class="ctl-btn">Text</button>
        </div>

        <!-- Strobe controls. Mode picks which layer flickers: the background
             (toward the inverse theme color), the foreground text (by dimming
             its opacity), both, or off. Stop is a kill switch. Mode always
             starts at Off when a book opens; Hz/Intensity/Shape persist. -->
        <div id="strobe-row" class="strobe-row">
          <div id="strobe-mode" class="font-options" aria-label="Strobe mode">
            <button type="button" class="font-option" data-mode="off">
              Off
            </button>
            <button type="button" class="font-option" data-mode="fg">
              FG
            </button>
            <button type="button" class="font-option" data-mode="bg">
              BG
            </button>
            <button type="button" class="font-option" data-mode="both">
              Both
            </button>
          </div>
          <button id="strobe-stop" class="ctl-btn strobe-stop">Stop</button>
          <label class="strobe-ctl"
            >Hz
            <input id="strobe-freq" type="range" min="1" max="60" step="1" />
            <span id="strobe-freq-val"></span>
          </label>
          <label class="strobe-ctl"
            >Intensity
            <input
              id="strobe-intensity"
              type="range"
              min="0"
              max="100"
              step="1"
            />
            <span id="strobe-intensity-val"></span>
          </label>
          <div id="strobe-shape" class="font-options">
            <button type="button" class="font-option" data-shape="sine">
              Sine
            </button>
            <button type="button" class="font-option" data-shape="square">
              Square
            </button>
          </div>
        </div>

        <!-- Jiggle controls. Mode oscillates the reading text back and forth
             horizontally or vertically (or off) via a CSS translate animation.
             Mode always starts at Off when a book opens; Hz/Intensity persist. -->
        <div id="jiggle-row" class="strobe-row">
          <div id="jiggle-mode" class="font-options" aria-label="Jiggle mode">
            <button type="button" class="font-option" data-mode="off">
              Off
            </button>
            <button type="button" class="font-option" data-mode="horizontal">
              Horizontal
            </button>
            <button type="button" class="font-option" data-mode="vertical">
              Vertical
            </button>
          </div>
          <label class="strobe-ctl"
            >Hz
            <input id="jiggle-freq" type="range" min="1" max="30" step="1" />
            <span id="jiggle-freq-val"></span>
          </label>
          <label class="strobe-ctl"
            >Intensity
            <input
              id="jiggle-intensity"
              type="range"
              min="0"
              max="100"
              step="1"
            />
            <span id="jiggle-intensity-val"></span>
          </label>
        </div>
      </div>

      <!-- Table of contents drawer -->
      <aside id="toc-panel" class="toc-panel">
        <h2>Contents</h2>
        <ul id="toc-list"></ul>
      </aside>
    </section>

    <!-- ===================== THEME EDITOR ===================== -->
    <div id="theme-editor" class="modal">
      <div class="modal-card">
        <h2>Themes</h2>
        <div id="editor-theme-list" class="editor-theme-list"></div>
        <hr />
        <h3 id="editor-heading">New theme</h3>
        <label
          >Name <input id="te-name" type="text" placeholder="My theme"
        /></label>
        <label class="swatch-label"
          >Background
          <div id="te-bg-swatches" class="swatch-grid"></div>
        </label>
        <label class="swatch-label"
          >Text color
          <div id="te-fg-swatches" class="swatch-grid"></div>
        </label>
        <div class="modal-actions">
          <button id="te-delete" class="danger" hidden>Delete</button>
          <span class="spacer"></span>
          <button id="te-cancel" class="ctl-btn">Close</button>
          <button id="te-save" class="primary">Save</button>
        </div>
      </div>
    </div>

    <!-- ===================== TEXT (TYPOGRAPHY) EDITOR ===================== -->
    <div id="typo-editor" class="modal">
      <div class="modal-card">
        <h2>Text</h2>
        <div id="typo-list" class="editor-theme-list"></div>
        <hr />
        <h3 id="typo-heading">New preset</h3>
        <label
          >Name <input id="ty-name" type="text" placeholder="My preset"
        /></label>
        <label class="swatch-label"
          >Reading font
          <div id="ty-font" class="font-options"></div>
        </label>
        <label
          >Line height
          <input id="ty-line" type="range" min="1.1" max="2.2" step="0.05" />
          <span id="ty-line-val"></span>
        </label>
        <label
          >Paragraph spacing
          <input id="ty-para" type="range" min="0" max="2" step="0.1" />
          <span id="ty-para-val"></span>
        </label>
        <label
          >Margin
          <input id="ty-margin" type="range" min="0" max="80" step="2" />
          <span id="ty-margin-val"></span>
        </label>
        <div class="modal-actions">
          <button id="ty-delete" class="danger" hidden>Delete</button>
          <span class="spacer"></span>
          <button id="ty-cancel" class="ctl-btn">Close</button>
          <button id="ty-save" class="primary">Save</button>
        </div>
      </div>
    </div>

    <!-- ===================== UPDATE BANNER ===================== -->
    <div id="update-banner" class="update-banner" hidden>
      <span class="update-msg">A new version is available.</span>
      <button id="update-reload" class="primary">Refresh</button>
      <button id="update-dismiss" class="icon-btn" title="Dismiss">✕</button>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
